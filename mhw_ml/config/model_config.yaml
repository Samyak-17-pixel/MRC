# MHW ML Forecasting Configuration
# Maritime Research Center — Bay of Bengal Marine Heatwave Project

project:
  name: "BoB MHW Onset Forecasting"
  author: "Samyak Kumar"
  study_period: "2006-2025"

paths:
  workspace: "/home/samyak/mrc_ws"
  results: "/home/samyak/mrc_ws/results"

task:
  type: onset_warning          # predict new MHW start within horizon
  min_consecutive_days: 5      # Hobday et al. 2016 definition
  horizons_days: [3, 7, 14]

regions:
  - north
  - central
  - south

model_scope: per_region        # train separate model per region

splits:
  train_years: [2006, 2018]
  val_years: [2019, 2021]
  test_years: [2022, 2025]

features:
  rolling_windows: [7, 14, 21, 30]
  climate_lag_months: [0, 1, 2, 3, 6]

models:
  primary: xgboost
  compare:
    - random_forest
    - gradient_boosting
  xgboost:
    n_estimators: 300
    max_depth: 5
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    scale_pos_weight: auto
  random_forest:
    n_estimators: 300
    max_depth: 8
    class_weight: balanced

evaluation:
  metrics:
    - accuracy
    - precision
    - recall
    - f1
    - roc_auc
    - pr_auc
    - brier_score
